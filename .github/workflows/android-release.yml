name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.1)"
        required: true
      changelog:
        description: "Release notes/changelog (optional; supports multiline)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ inputs.version_name }} -PversionCode=${{ github.run_number }}
      - name: Prepare named release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          CLEAN_VERSION="${VERSION_NAME#v}"
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          DOWNLOAD_APK="app/build/outputs/apk/release/blbl-${CLEAN_VERSION}-release.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "${DOWNLOAD_APK}"
          echo "DOWNLOAD_APK=${DOWNLOAD_APK}" >> "${GITHUB_ENV}"
      - name: Publish APK + latest.txt to release branch
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_VERSION: ${{ env.CLEAN_VERSION }}
          DOWNLOAD_APK: ${{ env.DOWNLOAD_APK }}
        run: |
          set -euo pipefail

          APK_ABS_PATH="$(readlink -f "${DOWNLOAD_APK}")"
          APK_NAME="$(basename "${DOWNLOAD_APK}")"

          publish_dir="$(mktemp -d)"
          git -C "${publish_dir}" init -q
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" checkout -q --orphan release

          # release 分支只保留本次发布的产物：先清空工作区，再放入新文件（历史提交仍保留在 git 里，
          # 但通过 --force 推送 orphan 分支后，远端分支的树内容会被整体替换为只含本次文件）。
          find "${publish_dir}" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          printf '%s' "${CLEAN_VERSION}" > "${publish_dir}/latest.txt"
          cp "${APK_ABS_PATH}" "${publish_dir}/${APK_NAME}"

          git -C "${publish_dir}" add -A
          git -C "${publish_dir}" commit -q -m "release: ${CLEAN_VERSION}"

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${publish_dir}" push --force "${remote_url}" HEAD:release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: blbl-android-${{ inputs.version_name }}-release
          path: ${{ env.DOWNLOAD_APK }}
      - name: Publish release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_TAG: ${{ startsWith(inputs.version_name, 'v') && inputs.version_name || format('v{0}', inputs.version_name) }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release edit "$RELEASE_TAG" --notes-file changelog.md
            fi
          else
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file changelog.md --target "$GITHUB_SHA"
            else
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
          gh release upload "$RELEASE_TAG" "$DOWNLOAD_APK" --clobber
